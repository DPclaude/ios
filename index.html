<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="计划本">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191d1a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180-v3.png">
<link rel="icon" href="icon-192-v3.png">
<link rel="manifest" href="manifest.webmanifest">
<title>计划本</title>
<style>

:root{color-scheme:light dark;--bg:#f7f5f0;--card:#fffefa;--text:#292d29;--sub:#777c73;--line:#e8e7df;--accent:#c65b34;--soft:#f6e8df;--done:#999e95;--c0:#8b9186;--c1:#6287a2;--c2:#c65b34;--c3:#6e8965;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#191d1a;--card:#242a25;--text:#f1f2e9;--sub:#a4ac9f;--line:#363e36;--accent:#f0a078;--soft:#3a2e26;--done:#90988b;--c0:#9aa58f;--c1:#91b4d2;--c2:#f0a078;--c3:#a2ba8b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea{font:inherit}button{color:inherit;background:none;border:0;padding:0;cursor:pointer}button,input,textarea{-webkit-appearance:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
button{touch-action:manipulation}button:active{transform:translateY(1px)}
header,main{max-width:680px;margin:auto}
header{padding:calc(var(--safe-t) + 25px) 24px 0}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:27px}
.brand-name{display:flex;gap:9px;align-items:center;font-size:15px;font-weight:650;letter-spacing:2px}
.brand-mark{display:grid;place-items:center;width:29px;height:29px;background:var(--accent);color:var(--card);border-radius:10px;font-size:18px;letter-spacing:0}
.eyebrow{font-size:10px;letter-spacing:2px;color:var(--sub)}
.menu{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;color:var(--sub);font-size:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.date{font-size:34px;font-weight:730;letter-spacing:-1.5px;line-height:1.2}
.week{color:var(--sub);font-size:13px;margin-top:8px}
.nav{display:flex;gap:5px;align-items:center}.nav button{width:44px;height:44px;border-radius:50%;font-size:25px;color:var(--sub)}
.nav .today{width:auto;padding:0 10px;font-size:13px;color:var(--accent);background:var(--soft);border-radius:14px;font-weight:600}
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:25px 0 20px}
.day{height:68px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--sub)}
.day span{font-size:11px}.day strong{font-size:18px;font-weight:600}.day.is-today strong{color:var(--accent)}
.day.selected{background:var(--text);color:var(--bg);box-shadow:0 5px 12px #1f2a1712}.day.selected strong{color:var(--bg)}
.summary{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--card);padding:21px 22px;display:flex;align-items:center;gap:20px}
.summary-copy{flex:1}.summary-label{color:var(--sub);font-size:12px;letter-spacing:1px}.summary-title{font-size:21px;letter-spacing:-.5px;font-weight:650;margin:5px 0}.summary-detail{font-size:12px;color:var(--sub)}
.ring{width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--progress,0%),var(--line) 0);transform:rotate(-0deg)}
.ring-inner{display:flex;flex-direction:column;justify-content:center;align-items:center;width:64px;height:64px;border-radius:50%;background:var(--card)}
.ring strong{font-size:19px;line-height:1.2}.ring small{font-size:10px;color:var(--sub);margin-top:3px}
main{padding:24px 24px calc(116px + var(--safe-b))}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.section-title h2{margin:0;font-size:17px;letter-spacing:.2px}.section-title span{font-size:12px;color:var(--sub)}
.filters{display:flex;gap:7px;margin:0 0 18px;overflow-x:auto;scrollbar-width:none}.filters button{flex:1;white-space:nowrap;border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 9px;font-size:12px;color:var(--sub)}
.filters button.active{border-color:var(--accent);color:var(--accent);background:var(--soft);font-weight:650}
ul{list-style:none;margin:0;padding:0}
li.task{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:18px;padding:10px 12px 10px 9px;margin-bottom:9px;border:1px solid var(--line);min-height:76px;transition:background .2s}
.chk{flex:none;width:44px;height:44px;display:grid;place-items:center;position:relative}.chk:before{content:"";width:23px;height:23px;border-radius:50%;border:1.5px solid var(--cat,var(--c0));position:absolute}.chk svg{position:relative;width:14px;height:14px;opacity:0}li.done .chk:before{background:var(--cat,var(--c0));border-color:var(--cat,var(--c0))}li.done .chk svg{opacity:1}
.body{flex:1;min-width:0;text-align:left;min-height:44px;padding:2px 0}.txt{display:block;word-break:break-word;font-size:15px;line-height:1.5;font-weight:550}li.done{background:transparent;border-color:transparent}li.done .txt{color:var(--done);text-decoration:line-through;font-weight:400}
.meta{display:block;font-size:11px;color:var(--sub);margin-top:5px;letter-spacing:.1px}.task-arrow{color:var(--line);font-size:20px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--accent);margin-right:6px;vertical-align:middle}
.empty{text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--sub);padding:30px 14px;font-size:13px}.empty-icon{font-size:26px;color:var(--accent);margin-bottom:8px}.empty strong{display:block;font-size:16px;color:var(--text);font-weight:550;margin-bottom:4px}
.sec{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:12px;padding:8px 2px}.sec button{color:var(--sub);font-size:12px;min-height:44px;padding:0 8px}
.note-area{margin-top:28px}.note-area .section-title{margin-bottom:11px}.note{width:100%;min-height:108px;resize:vertical;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:15px 16px;font-size:14px;line-height:1.8}.note::placeholder{color:var(--sub)}
.footer-note{margin:17px 0 0;text-align:center;color:var(--sub);font-size:10px;letter-spacing:1px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:12px max(16px,calc((100vw - 632px)/2)) calc(12px + var(--safe-b));display:flex;gap:8px;align-items:center}
.catbtn{flex:none;min-width:48px;height:48px;border-radius:15px;background:var(--card);border:1px solid var(--line);display:flex;gap:5px;align-items:center;justify-content:center;padding:0 10px}.catbtn span{width:8px;height:8px;border-radius:50%;background:var(--cat)}.catbtn small{font-size:11px;color:var(--sub)}
#input{flex:1;min-width:0;height:48px;border-radius:15px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 13px;font-size:16px}#input:focus{border-color:var(--accent);outline:none}
.add{flex:none;width:48px;height:48px;border-radius:15px;background:var(--accent);color:var(--card);font-size:28px;font-weight:350;box-shadow:0 4px 12px #c65b341a}
.mask{position:fixed;inset:0;background:#10181066;backdrop-filter:blur(4px);z-index:10;display:none}.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:680px;margin:auto;z-index:11;background:var(--card);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:14px 22px calc(24px + var(--safe-b));transform:translateY(110%);transition:transform .22s ease;visibility:hidden;max-height:90dvh;overflow-y:auto}
.sheet.show{transform:none;visibility:visible}.sheet:before{content:"";display:block;width:34px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 18px}.sheet-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet h3{margin:0;font-size:19px}.close-sheet{min-width:44px;min-height:44px;font-size:23px;color:var(--sub)}
.sheet textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:15px;background:var(--bg);color:var(--text);padding:13px;font-size:16px;resize:vertical}.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row button,.row label{flex:1;min-width:28%;min-height:48px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font-size:13px;display:grid;place-items:center}.row .primary{background:var(--accent);color:var(--card);border-color:var(--accent);font-weight:600}.row .danger{color:#d0564c}
.cats{display:flex;gap:7px;margin-top:13px}.cats button{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px}.cats button i{width:7px;height:7px;border-radius:50%;background:var(--cat)}.cats button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.hint{font-size:12px;color:var(--sub);margin-top:17px;line-height:1.8}.ver{font-size:11px;color:var(--sub);text-align:center;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 17px;border-radius:14px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none;display:flex;gap:18px;align-items:center;white-space:nowrap;max-width:calc(100vw - 24px)}.toast.show{opacity:1;pointer-events:auto}.toast button{color:var(--bg);font-weight:650;text-decoration:underline;min-height:30px}
.update{position:fixed;left:12px;right:12px;max-width:640px;margin:auto;top:calc(var(--safe-t) + 8px);z-index:30;background:var(--accent);color:var(--card);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;display:none;align-items:center;justify-content:space-between;box-shadow:0 6px 20px #0002}.update.show{display:flex}
@media(min-width:760px){header{padding-top:45px}.date{font-size:40px}.week-strip{gap:15px}.day{height:75px}main{padding-top:30px}.summary{padding:25px}.sheet{bottom:16px;border-radius:28px}.bar{padding-top:16px;padding-bottom:calc(16px + var(--safe-b))}}
@media(max-width:360px){header{padding-left:16px;padding-right:16px}main{padding-left:16px;padding-right:16px}.date{font-size:29px}.filters{gap:4px}.filters button{padding:0 6px}.eyebrow{letter-spacing:1px}.summary{padding:18px;gap:12px}.ring{width:64px;height:64px}.ring-inner{width:54px;height:54px}.summary-title{font-size:18px}.summary-detail{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-name"><span class="brand-mark" aria-hidden="true">✓</span>计划本 <span class="eyebrow">ONE DAY AT A TIME</span></div><button class="menu" id="menuBtn" aria-label="设置">⋯</button></div>
  <div class="top">
    <div>
      <div class="date" id="dateTitle"></div>
      <div class="week" id="dateSub"></div>
    </div>
    <div class="nav">
      <button class="today" id="goToday" hidden>今天</button>
      <button id="prev" aria-label="前一天">‹</button>
      <button id="next" aria-label="后一天">›</button>
    </div>
  </div>
  <nav class="week-strip" id="weekStrip" aria-label="本周日期"></nav>
  <section class="summary" aria-label="当天进度">
    <div class="summary-copy"><div class="summary-label" id="summaryLabel">今天的小步前进</div><div class="summary-title" id="summaryTitle"></div><div class="summary-detail" id="summaryDetail"></div></div>
    <div class="ring" id="prog" role="progressbar" aria-label="任务完成进度" aria-valuemin="0" aria-valuemax="100"><div class="ring-inner"><strong id="progressText">0%</strong><small>已完成</small></div></div>
  </section>
</header>

<main id="main">
  <div class="section-title"><h2>待办清单</h2><span id="openCount"></span></div>
  <nav class="filters" id="filters" aria-label="按分类筛选"></nav>
  <ul id="list" aria-label="待办任务"></ul>
  <div class="empty" id="empty"></div>
  <div class="sec" id="doneHead" hidden>
    <span id="doneCount"></span>
    <button id="toggleDone"></button>
  </div>
  <ul id="doneList" aria-label="已完成任务"></ul>
  <section class="note-area"><div class="section-title"><h2>随手记</h2><span>自动保存</span></div>
  <textarea class="note" id="note" aria-label="当天备忘" placeholder="留一点空间，给今天的想法…"></textarea></section>
  <p class="footer-note">不必一下做好所有事，先完成眼前这一件。</p>
</main>

<div class="bar">
  <button class="catbtn" id="catBtn" aria-label="分类"><span></span><small id="catName">默认</small></button>
  <input id="input" aria-label="新任务" placeholder="记下一件要做的事…" enterkeyhint="done" autocomplete="off">
  <button class="add" id="addBtn" aria-label="添加任务">+</button>
</div>

<div class="mask" id="mask"></div>

<div class="sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="editTitle" inert>
  <div class="sheet-heading"><h3 id="editTitle">编辑任务</h3><button class="close-sheet" id="closeEdit" aria-label="关闭编辑">×</button></div>
  <textarea id="editText" aria-label="任务内容"></textarea>
  <div class="cats" id="editCats"></div>
  <div class="row">
    <button id="toTop">置顶</button>
    <button id="toTomorrow">移到明天</button>
    <button id="repeatBtn">每天重复</button>
  </div>
  <div class="row">
    <button class="danger" id="delBtn">删除</button>
    <button class="primary" id="saveBtn">保存</button>
  </div>
</div>

<div class="sheet" id="menuSheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle" inert>
  <div class="sheet-heading"><h3 id="menuTitle">设置与备份</h3></div>
  <div class="row">
    <button id="exportBtn">导出备份</button>
    <label>导入备份<input type="file" id="importFile" accept=".json,application/json" hidden></label>
  </div>
  <div class="hint">
    数据只保存在这台手机上。建议每周导出一次备份（可存到"文件"或发给自己）。<br>
    小技巧：左右滑动可以切换日期；没做完的任务会自动顺延到今天。
  </div>
  <div class="row">
    <button id="checkUpdate">检查更新</button>
    <button id="closeMenu">关闭</button>
  </div>
  <div class="ver" id="verText"></div>
</div>

<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="undoBtn" hidden>撤销</button></div>
<button class="update" id="updateBar"><span>有新版本 ✨</span><span>点击更新</span></button>

<script>
(() => {
const KEY = 'planner-v1';
const VERSION = '2026.09.29-3';
const CATS = [
  {name:'默认', color:'var(--c0)'},
  {name:'工作', color:'var(--c1)'},
  {name:'私事', color:'var(--c2)'},
  {name:'学习', color:'var(--c3)'},
];
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const $ = id => document.getElementById(id);

// ---------- data ----------
let db = load();
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.tasks)) return {tasks:d.tasks, notes:d.notes||{}, repeats:d.repeats||[], repeatDone:d.repeatDone||{}};
  }catch(e){}
  return {tasks:[], notes:{}, repeats:[], repeatDone:{}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('保存失败，请导出备份'); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function ymd(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function parse(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function shift(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); }
const todayStr = () => ymd(new Date());

// 未完成的旧任务顺延到今天
function rollover(){
  const t = todayStr(); let changed=false;
  db.tasks.forEach(k => {
    if (!k.done && k.date < t){ k.date = t; k.rolled = true; changed = true; }
  });
  // 清理90天前已完成的重复记录
  const cutoff = shift(t,-90);
  Object.keys(db.repeatDone).forEach(d => { if (d < cutoff){ delete db.repeatDone[d]; changed=true; } });
  if (changed) save();
}

// 每天重复的任务：按日期生成“虚拟任务”，完成状态存在 repeatDone
function repeatItems(date){
  const doneSet = db.repeatDone[date] || [];
  return db.repeats
    .filter(r => r.from <= date)
    .map(r => ({id:'r:'+r.id, rid:r.id, text:r.text, cat:r.cat, date, done:doneSet.includes(r.id), repeat:true, order:-1}));
}

// ---------- state ----------
let cur = todayStr();
let newCat = 0;
let showDone = true;
let editing = null;
let editCat = 0;
let filterCat = -1;
let undoAction = null;
let focusBeforeSheet = null;

// ---------- render ----------
function render(){
  const d = parse(cur), t = todayStr();
  const rel = cur===t ? '今天' : cur===shift(t,1) ? '明天' : cur===shift(t,-1) ? '昨天' : '';
  $('dateTitle').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日';
  $('dateSub').textContent = WEEK[d.getDay()] + (rel ? ' · '+rel : '') + (d.getFullYear()!==new Date().getFullYear() ? ' · '+d.getFullYear() : '');
  $('goToday').hidden = cur===t;

  const items = repeatItems(cur).concat(db.tasks.filter(k => k.date===cur));
  const visible = items.filter(k=>filterCat<0 || (k.cat||0)===filterCat);
  const open = visible.filter(k=>!k.done).sort((a,b)=>(a.order-b.order));
  const done = visible.filter(k=>k.done).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  const totalDone = items.filter(k=>k.done).length;
  const percent = items.length ? Math.round(totalDone/items.length*100) : 0;
  $('summaryLabel').textContent = cur===t ? '今天的小步前进' : '这一天的小步前进';
  $('summaryTitle').textContent = !items.length ? '从一件小事开始' : totalDone===items.length ? '都完成了，做得不错' : '还有 '+(items.length-totalDone)+' 件小事';
  $('summaryDetail').textContent = items.length ? '共 '+items.length+' 项计划 · 已完成 '+totalDone+' 项' : '给重要的事，留一点时间。';
  $('prog').style.setProperty('--progress', percent+'%');
  $('prog').setAttribute('aria-valuenow', percent);
  $('progressText').textContent = percent+'%';
  $('openCount').textContent = open.length+' 项待办';
  drawWeek(); drawFilters();

  $('list').innerHTML = ''; $('doneList').innerHTML = '';
  open.forEach(k => $('list').appendChild(item(k)));
  if (showDone) done.forEach(k => $('doneList').appendChild(item(k)));

  $('empty').hidden = open.length>0;
  $('empty').innerHTML = done.length ? '<div class="empty-icon" aria-hidden="true">✓</div><strong>这一页的待办都完成了</strong>歇一歇，也是一种进步。' : '<div class="empty-icon" aria-hidden="true">＋</div><strong>'+(filterCat<0 ? '给这一天一个小目标' : '这个分类还没有计划')+'</strong>在下方记下第一件事吧。';
  $('doneHead').hidden = done.length===0;
  $('doneCount').textContent = '已完成 '+done.length;
  $('toggleDone').textContent = showDone ? '收起' : '展开';


  $('note').value = db.notes[cur] || '';
  $('catBtn').style.setProperty('--cat', CATS[newCat].color);
  $('catName').textContent = CATS[newCat].name;
  $('catBtn').setAttribute('aria-label', '新任务分类：'+CATS[newCat].name+'，点击切换');
}

function drawWeek(){
  const start = shift(cur, -((parse(cur).getDay()+6)%7));
  $('weekStrip').innerHTML = '';
  for(let i=0;i<7;i++){
    const date = shift(start,i), d = parse(date), b = document.createElement('button');
    b.className = 'day'+(date===cur?' selected':'')+(date===todayStr()?' is-today':'');
    b.setAttribute('aria-label', (d.getMonth()+1)+'月'+d.getDate()+'日 '+WEEK[d.getDay()]);
    b.setAttribute('aria-pressed', String(date===cur));
    b.innerHTML = '<span>'+(date===todayStr()?'今天':WEEK[d.getDay()])+'</span><strong>'+d.getDate()+'</strong>';
    b.onclick = () => { cur=date; render(); }; $('weekStrip').appendChild(b);
  }
}
function drawFilters(){
  $('filters').innerHTML = '';
  [{name:'全部'},...CATS].forEach((c,i)=>{
    const cat=i-1,b=document.createElement('button');
    b.textContent=c.name; b.className=cat===filterCat?'active':'';
    b.setAttribute('aria-pressed',String(cat===filterCat));
    b.onclick=()=>{filterCat=cat;if(cat>=0)newCat=cat;render();};
    $('filters').appendChild(b);
  });
}

function item(k){
  const li = document.createElement('li');
  li.className = 'task' + (k.done?' done':'');
  li.style.setProperty('--cat', CATS[k.cat||0].color);
  const meta = [];
  if (k.repeat) meta.push('每天');
  if (k.cat) meta.push(CATS[k.cat].name);
  li.innerHTML = `
    <button class="chk" aria-label="${k.done ? '标为未完成' : '完成任务'}：${esc(k.text)}" aria-pressed="${k.done}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    <button class="body" aria-label="编辑：${esc(k.text)}">
      <span class="txt">${k.rolled && !k.done ? '<span class="tag">顺延</span>':''}${esc(k.text)}</span>
      ${meta.length? `<span class="meta">${meta.join(' · ')}</span>`:''}
    </button><span class="task-arrow" aria-hidden="true">›</span>`;
  li.querySelector('.chk').onclick = e => { e.stopPropagation(); toggle(k); };
  li.querySelector('.body').onclick = () => openEdit(k);
  return li;
}
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- actions ----------
function add(){
  const text = $('input').value.trim();
  if (!text) return;
  const orders = db.tasks.filter(k=>k.date===cur).map(k=>k.order);
  db.tasks.push({id:uid(), text, date:cur, done:false, cat:newCat, order:(orders.length?Math.max(...orders):0)+1});
  $('input').value = '';
  if(filterCat>=0 && filterCat!==newCat)filterCat=newCat;
  save(); render();
}
function toggle(k){
  if (k.repeat){
    const arr = db.repeatDone[cur] || (db.repeatDone[cur]=[]);
    const i = arr.indexOf(k.rid);
    i>=0 ? arr.splice(i,1) : arr.push(k.rid);
  } else {
    const t = db.tasks.find(x=>x.id===k.id); if (!t) return;
    t.done = !t.done; t.doneAt = t.done ? Date.now() : 0;
    if (t.done) t.rolled = false;
  }
  if (navigator.vibrate) navigator.vibrate(10);
  save(); render();
}

// ---------- edit sheet ----------
function openEdit(k){
  editing = k; editCat = k.cat||0;
  $('editText').value = k.text;
  $('toTop').hidden = !!k.repeat;
  $('toTomorrow').hidden = !!k.repeat;
  $('repeatBtn').textContent = k.repeat ? '取消每天重复' : '设为每天重复';
  drawEditCats();
  open('editSheet');
}
function drawEditCats(){
  $('editCats').innerHTML = '';
  CATS.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = i===editCat ? 'on' : '';
    b.style.setProperty('--cat', c.color);
    b.innerHTML = `<i></i>${c.name}`;
    b.onclick = () => { editCat = i; drawEditCats(); };
    $('editCats').appendChild(b);
  });
}
function findEditing(){
  if (!editing) return null;
  return editing.repeat ? db.repeats.find(r=>r.id===editing.rid) : db.tasks.find(x=>x.id===editing.id);
}
$('saveBtn').onclick = () => {
  const t = findEditing(); const text = $('editText').value.trim();
  if (t && text){ t.text = text; t.cat = editCat; save(); }
  close(); render();
};
$('delBtn').onclick = () => {
  if (!editing) return;
  const repeated = editing.repeat;
  const removed = findEditing(); if(!removed)return;
  if (repeated) db.repeats = db.repeats.filter(r=>r.id!==editing.rid);
  else db.tasks = db.tasks.filter(x=>x.id!==editing.id);
  save(); close(); render();
  toast(repeated ? '已删除重复任务' : '已删除任务', () => {
    (repeated ? db.repeats : db.tasks).push(removed);
    rollover(); save(); render();
  });
};
$('toTop').onclick = () => {
  const t = findEditing(); if (!t) return;
  const orders = db.tasks.filter(k=>k.date===cur).map(k=>k.order);
  t.order = Math.min(...orders) - 1; save(); close(); render();
};
$('toTomorrow').onclick = () => {
  const t = findEditing(); if (!t) return;
  t.date = shift(cur,1); t.rolled=false; t.done=false; save(); close(); render(); toast('已移到明天');
};
$('repeatBtn').onclick = () => {
  const t = findEditing(); if (!t) return;
  if (editing.repeat){
    // 取消重复：从今天起不再出现，今天保留一个普通任务
    db.repeats = db.repeats.filter(r=>r.id!==editing.rid);
    db.tasks.push({id:uid(), text:t.text, date:cur, done:editing.done, doneAt:editing.done?Date.now():0, cat:t.cat, order:0});
    toast('已取消每天重复');
  } else {
    const r = {id:uid(), text:$('editText').value.trim()||t.text, cat:editCat, from:cur};
    db.repeats.push(r);
    if (t.done) (db.repeatDone[cur] || (db.repeatDone[cur]=[])).push(r.id);
    db.tasks = db.tasks.filter(x=>x.id!==t.id);
    toast('已设为每天重复');
  }
  save(); close(); render();
};

// ---------- menu / backup ----------
$('menuBtn').onclick = () => open('menuSheet');
$('closeMenu').onclick = close;
$('exportBtn').onclick = async () => {
  const name = '计划本备份-'+todayStr()+'.json';
  const blob = new Blob([JSON.stringify(db,null,1)], {type:'application/json'});
  const file = new File([blob], name, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if (e.name==='AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
};
$('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.tasks)) throw 0;
      if (!confirm('导入会覆盖现在的数据，确定吗？')) return;
      db = {tasks:d.tasks, notes:d.notes||{}, repeats:d.repeats||[], repeatDone:d.repeatDone||{}};
      save(); rollover(); close(); render(); toast('导入成功');
    }catch(err){ toast('文件格式不对'); }
    e.target.value = '';
  };
  r.readAsText(f);
};

// ---------- sheets ----------
function open(id){
  focusBeforeSheet=document.activeElement;
  $('mask').classList.add('show'); $(id).inert=false; $(id).classList.add('show');
  document.querySelectorAll('header,main,.bar').forEach(el=>el.inert=true);
  $(id).querySelector('button,textarea').focus();
}
function close(){
  document.querySelectorAll('.sheet').forEach(s=>{s.classList.remove('show');s.inert=true;});
  document.querySelectorAll('header,main,.bar').forEach(el=>el.inert=false);
  $('mask').classList.remove('show'); editing=null;
  if(focusBeforeSheet && focusBeforeSheet.isConnected)focusBeforeSheet.focus();
}
$('closeEdit').onclick=close;
document.addEventListener('keydown',e=>{
  const sheet=document.querySelector('.sheet.show'); if(!sheet)return;
  if(e.key==='Escape'){close();return;}
  if(e.key!=='Tab')return;
  const elements=[...sheet.querySelectorAll('button,textarea,input,[tabindex="0"]')].filter(el=>!el.hidden && el.offsetParent!==null);
  const first=elements[0],last=elements[elements.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
});
$('mask').onclick = close;

// ---------- misc ui ----------
let tt;
function toast(msg,undo){
  const t=$('toast'); $('toastText').textContent=msg; undoAction=undo||null; $('undoBtn').hidden=!undo;
  t.classList.add('show'); clearTimeout(tt);
  tt=setTimeout(()=>{t.classList.remove('show');undoAction=null;$('undoBtn').hidden=true;},undo?7000:2200);
}
$('undoBtn').onclick=()=>{if(!undoAction)return;const action=undoAction;undoAction=null;action();toast('已恢复任务');};

$('addBtn').onclick = () => { add(); $('input').focus(); };
$('input').addEventListener('keydown', e => { if (e.key==='Enter' && !e.isComposing){ e.preventDefault(); add(); } });
$('catBtn').onclick = () => { newCat = (newCat+1)%CATS.length; render(); toast('新任务分类：'+CATS[newCat].name); };
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('goToday').onclick = () => { cur = todayStr(); render(); };
$('toggleDone').onclick = () => { showDone=!showDone; render(); };
$('note').addEventListener('input', e => {
  const v = e.target.value;
  if (v.trim()) db.notes[cur]=v; else delete db.notes[cur];
  save();
});
function go(n){ cur = shift(cur,n); render(); }

// 左右滑动切换日期
let sx=0, sy=0, st=0;
$('main').addEventListener('touchstart', e => { const p=e.touches[0]; sx=p.clientX; sy=p.clientY; st=Date.now(); }, {passive:true});
$('main').addEventListener('touchend', e => {
  if (e.target.closest('textarea')) return;
  const p=e.changedTouches[0], dx=p.clientX-sx, dy=p.clientY-sy;
  if (Date.now()-st<600 && Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5) go(dx<0?1:-1);
}, {passive:true});

// 回到前台时：跨天自动切到今天并顺延
let lastDay = todayStr();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState!=='visible') return;
  const t = todayStr();
  if (t!==lastDay){ if (cur===lastDay) cur=t; lastDay=t; }
  rollover(); render();
});

// ---------- 一键更新 ----------
async function checkUpdate(manual){
  try{
    const r = await fetch('version.json?t='+Date.now(), {cache:'no-store'});
    const v = (await r.json()).version;
    if (v && v !== VERSION){ $('updateBar').classList.add('show'); if (manual) close(); }
    else if (manual) toast('已经是最新版本');
  }catch(e){ if (manual) toast('没有网络，稍后再试'); }
}
$('updateBar').onclick = async () => {
  $('updateBar').querySelector('span').textContent = '更新中…';
  try{
    if (window.caches) for (const k of await caches.keys()) if(k.startsWith('planner-'))await caches.delete(k);
    if (navigator.serviceWorker){ const r = await navigator.serviceWorker.getRegistration(new URL('./',location.href)); if(r)await r.update(); }
  }catch(e){}
  location.replace(location.pathname + '?v=' + Date.now());
};
$('checkUpdate').onclick = () => checkUpdate(true);
$('verText').textContent = '版本 ' + VERSION;
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible') checkUpdate(false); });
checkUpdate(false);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

rollover(); render();
})();
</script>
</body>
</html>
