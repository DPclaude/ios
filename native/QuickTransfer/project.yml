name: QuickTransfer
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  QuickTransfer:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pandong.quicktransfer
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": '-'
    info:
      path: build/Info.plist
      properties:
        CFBundleName: QuickTransfer
        CFBundleDisplayName: QuickTransfer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        NSCameraUsageDescription: 扫描电脑上的二维码，安全连接这台电脑。
        NSLocalNetworkUsageDescription: 在同一 Wi-Fi 内发现并传输文件到已配对的电脑。
        NSBonjourServices: [_quicktransfer._tcp]
        NSPhotoLibraryAddUsageDescription: 将您选择的已接收照片保存到相册。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  QuickTransferTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QuickTransfer
schemes:
  QuickTransfer:
    build:
      targets:
        QuickTransfer: all
    test:
      targets: [QuickTransferTests]
