name: Planner
options:
  bundleIdPrefix: com.dpclaude
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.3.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  PlannerModules:
    path: .
targets:
  Planner:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: PlannerWidget
        embed: true
      - package: PlannerModules
        product: PlannerCore
      - package: PlannerModules
        product: PlannerStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dpclaude.planner
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PLANNER_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTABILITY: YES
        CODE_SIGN_ENTITLEMENTS: Planner.entitlements
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Planner
        CFBundleName: Planner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleURLTypes:
          - CFBundleURLName: com.dpclaude.planner
            CFBundleURLSchemes: [planner]
        ALTAppGroups: [group.com.dpclaude.planner]
        LSRequiresIPhoneOS: true
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PlannerWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    dependencies:
      - package: PlannerModules
        product: PlannerCore
      - package: PlannerModules
        product: PlannerStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dpclaude.planner.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Planner.entitlements
    info:
      path: build/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Planner Widget
        CFBundleName: PlannerWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        ALTAppGroups: [group.com.dpclaude.planner]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PlannerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Planner
      - package: PlannerModules
        product: PlannerCore
      - package: PlannerModules
        product: PlannerStore
  PlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Planner
schemes:
  Planner:
    build:
      targets:
        Planner: all
    test:
      targets:
        - PlannerAppTests
        - PlannerUITests
      gatherCoverageData: true
