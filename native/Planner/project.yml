name: Planner
options:
  bundleIdPrefix: com.dpclaude
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  PlannerModules:
    path: .
targets:
  Planner:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PlannerModules
        product: PlannerCore
      - package: PlannerModules
        product: PlannerStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dpclaude.planner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTABILITY: YES
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: 计划本
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  PlannerAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Planner
      - package: PlannerModules
        product: PlannerCore
      - package: PlannerModules
        product: PlannerStore
  PlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Planner
schemes:
  Planner:
    build:
      targets:
        Planner: all
    test:
      targets:
        - PlannerAppTests
        - PlannerUITests
      gatherCoverageData: true
