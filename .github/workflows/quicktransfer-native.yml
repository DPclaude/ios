name: QuickTransfer Native
on:
  push:
    branches: [codex/quicktransfer-native]
    paths: ['.github/workflows/quicktransfer-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quicktransfer-native
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Materialize native transfer source
        run: |
          python3 - <<'PY'
          import base64,gzip,json,pathlib
          for name,encoded in json.loads(gzip.decompress(base64.b64decode(''))).items():
              p=pathlib.Path(name)
              assert name.startswith('native/QuickTransfer/') and '..' not in p.parts
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(base64.b64decode(encoded))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/QuickTransfer
          if ! git diff --cached --quiet; then
            git commit -m 'feat: native QuickTransfer source'
            git push origin HEAD:codex/quicktransfer-native
          fi
      - name: Toolchain
        run: |
          xcodebuild -version
          command -v xcodegen || brew install xcodegen
      - name: iPhone tests
        working-directory: native/QuickTransfer
        run: bash scripts/ci-test.sh
      - name: Build IPA
        working-directory: native/QuickTransfer
        run: bash scripts/build-ipa.sh
      - name: Native interface preview
        working-directory: native/QuickTransfer
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); v=[x for k,items in d["devices"].items() if "iOS" in k for x in items if "iPhone" in x["name"]]; print(next((x["udid"] for x in v if x["state"]=="Booted"),v[0]["udid"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl terminate "$DEVICE" com.pandong.quicktransfer || true
          xcrun simctl install "$DEVICE" build/Tests/Build/Products/Debug-iphonesimulator/QuickTransfer.app
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl launch "$DEVICE" com.pandong.quicktransfer
          sleep 2
          xcrun simctl io "$DEVICE" screenshot build/native-preview.png
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: QuickTransfer-native-${{ github.run_number }}
          path: |
            native/QuickTransfer/build/*.ipa
            native/QuickTransfer/build/*.sha256
            native/QuickTransfer/build/*.png
            native/QuickTransfer/build/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "quicktransfer-native-v1.0.0-b${{ github.run_number }}" native/QuickTransfer/build/QuickTransfer-unsigned.ipa native/QuickTransfer/build/QuickTransfer-unsigned.ipa.sha256 native/QuickTransfer/build/native-preview.png --target codex/quicktransfer-native --title "快捷互传原生版 1.0.0 (${{ github.run_number }})" --notes "SwiftUI 原生 iPhone App，配合新版 Windows 原生程序进行同 Wi-Fi 加密文件与文字互传。使用 SideStore 签名安装；不是网页入口。当前版本不含跨网中转，真机安装和权限需用户确认。" --prerelease --latest=false
