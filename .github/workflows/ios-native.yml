name: Native iOS
on:
  push:
    branches: [codex/native-ios]
    paths: ['.github/workflows/ios-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/codex/native-ios'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Materialize reviewed source
        id: apply
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,json,pathlib
          files=json.loads(gzip.decompress(base64.b64decode('')))
          for name,content in files.items():
              p=pathlib.Path(name)
              assert name.startswith(('native/','docs/')) and '..' not in p.parts and not p.is_absolute()
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(content,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native docs
          if ! git diff --cached --quiet; then
            git commit -m 'feat: widget snapshot and update delivery foundations'
            git push origin HEAD:codex/native-ios
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/cache/restore@v4
        id: xcodegen-cache
        with:
          path: native/Planner/build/XcodeGen
          key: xcodegen-2.46.0-macos26-xcode26.6-v1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl boot "iPhone 17 Pro"
      - name: Release metadata tests
        run: node --test native/Planner/scripts/release-metadata.test.mjs
      - name: Core tests
        continue-on-error: true
        run: swift test --package-path native/Planner
      - name: iOS tests and IPA
        shell: bash
        run: |
          cd native/Planner
          xcrun simctl bootstatus "iPhone 17 Pro" -b
          bash scripts/ci-test.sh
          bash scripts/build-ipa.sh
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/package/Payload/Planner.app/Info.plist)
          node scripts/release-metadata.mjs "$VERSION" build/Planner-unsigned.ipa build/release
      - uses: actions/cache/save@v4
        if: always() && steps.xcodegen-cache.outputs.cache-hit != 'true'
        with:
          path: native/Planner/build/XcodeGen
          key: xcodegen-2.46.0-macos26-xcode26.6-v1
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: Planner-native-${{ github.run_number }}
          path: |
            native/Planner/build/*.ipa
            native/Planner/build/release/
            native/Planner/build/*.sha256
            native/Planner/build/*.xcresult
            native/Planner/build/screenshots/
            native/Planner/build/*.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/codex/native-ios' && ((github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish native]')))
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Planner-native-${{ github.run_number }}
          path: dist
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('dist/release/planner-update.json','utf8')).version")
          TAG="native-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Version already published; increment MARKETING_VERSION before publishing again.'
            exit 1
          fi
          gh release create "$TAG" dist/release/Planner.ipa dist/release/planner-source.json dist/release/planner-update.json \
            --target "$GITHUB_SHA" --title "计划本 $VERSION" --notes-file dist/release/release-notes.md --latest
