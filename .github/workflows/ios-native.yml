name: Native iOS
on:
  push:
    branches: [codex/native-ios]
    paths: ['native/**', '.github/workflows/ios-native.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/ios-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v6.0.2
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/codex/native-ios" ]]; then
            echo '' | base64 -d | gzip -d > /tmp/native-source.patch
            if ! git apply --reverse --check /tmp/native-source.patch 2>/dev/null; then
              git apply /tmp/native-source.patch
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add native docs
              git commit -m 'test: materialize editor regression coverage'
              git push origin HEAD:codex/native-ios
            fi
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/cache/restore@v4
        id: xcodegen-cache
        with:
          path: native/Planner/build/XcodeGen
          key: xcodegen-2.46.0-macos26-xcode26.6-v1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core tests
        run: swift test --package-path native/Planner
      - name: iOS tests and IPA
        shell: bash
        run: |
          cd native/Planner
          bash scripts/ci-test.sh
          bash scripts/build-ipa.sh
      - uses: actions/cache/save@v4
        if: always() && steps.xcodegen-cache.outputs.cache-hit != 'true'
        with:
          path: native/Planner/build/XcodeGen
          key: xcodegen-2.46.0-macos26-xcode26.6-v1
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: Planner-native-${{ github.run_number }}
          path: |
            native/Planner/build/*.ipa
            native/Planner/build/*.sha256
            native/Planner/build/*.xcresult
            native/Planner/build/screenshots/
            native/Planner/build/*.log
          if-no-files-found: ignore
          retention-days: 7
