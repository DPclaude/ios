name: Native iOS
on:
  push:
    branches: [codex/native-ios]
    paths: ['.github/workflows/ios-native.yml']
permissions:
  contents: read
jobs:
  publish-verified-build-27:
    if: github.ref == 'refs/heads/codex/native-ios'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the exact tested source
        shell: bash
        run: |
          gh api repos/$GH_REPO/actions/runs/36528615241 > run.json
          gh api repos/$GH_REPO/actions/runs/36528615241/jobs > jobs.json
          python3 - <<'PY'
          import json
          r=json.load(open('run.json')); j=json.load(open('jobs.json'))
          assert r['head_sha']=='cfbc2a408619b58b7a9c5a2048f2c8b3ab017c5c'
          assert r['head_branch']=='codex/native-ios' and r['event']=='push'
          v=[x for x in j['jobs'] if x['name']=='verify']
          assert len(v)==1 and v[0]['conclusion']=='success'
          print('Verified source and completed test/build job for build 27.')
          PY
      - uses: actions/checkout@v6.0.2
        with:
          ref: cfbc2a408619b58b7a9c5a2048f2c8b3ab017c5c
          persist-credentials: false
      - name: Download the tested artifact
        run: gh run download 36528615241 --name Planner-native-27 --dir dist
      - name: Locate and publish verified assets
        shell: bash
        run: |
          mapfile -t IPAS < <(find dist -type f -name Planner-unsigned.ipa)
          test "${#IPAS[@]}" -eq 1
          export IPA="${IPAS[0]}"
          VERSION=$(python3 - <<'PY'
          import os,zipfile,plistlib
          with zipfile.ZipFile(os.environ['IPA']) as z:
              for path in ['Payload/Planner.app/Info.plist','Payload/Planner.app/PlugIns/PlannerWidget.appex/Info.plist']:
                  p=plistlib.loads(z.read(path))
                  assert p['CFBundleShortVersionString']=='1.1.0' and p['CFBundleVersion']=='27',p
          print('1.1.0')
          PY
          )
          node --test native/Planner/scripts/release-metadata.test.mjs
          node native/Planner/scripts/release-metadata.mjs "$VERSION" "$IPA" distribution
          RELEASE_DIR=distribution
          cmp "$IPA" "$RELEASE_DIR/Planner.ipa"
          unzip -t "$RELEASE_DIR/Planner.ipa"
          sha256sum "$RELEASE_DIR/Planner.ipa"
          TAG="native-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create "$TAG" "$RELEASE_DIR/Planner.ipa" "$RELEASE_DIR/planner-source.json" "$RELEASE_DIR/planner-update.json" \
            --target cfbc2a408619b58b7a9c5a2048f2c8b3ab017c5c --title "计划本 $VERSION" --notes-file "$RELEASE_DIR/release-notes.md" --latest
