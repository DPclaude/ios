name: Native iOS
on:
  push:
    branches: [codex/native-ios]
    paths: ['.github/workflows/ios-native.yml']
permissions:
  contents: write
  actions: read
jobs:
  correct-release-source:
    if: github.ref == 'refs/heads/codex/native-ios'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Link release tag to the exact tested source
        shell: bash
        run: |
          CURRENT=$(gh api repos/$GH_REPO/git/ref/tags/native-v1.1.0 --jq '.object.sha')
          test "$CURRENT" = '906a21d90b866639e267a47189dbf3d8b8d6dee8'
          gh api repos/$GH_REPO/actions/runs/36528615241/jobs --jq '.jobs[] | select(.name == "verify") | .conclusion' | grep -qx success
          gh api --method PATCH repos/$GH_REPO/git/refs/tags/native-v1.1.0 -f sha=cfbc2a408619b58b7a9c5a2048f2c8b3ab017c5c -F force=true
